# KitchenOps - Kompletter Stack für das Heimnetzwerk
#
# Start:       docker compose up -d --build
# Stop:        docker compose down
# Logs:        docker compose logs -f
#
# Erreichbar unter http://kitchenops.local (siehe Hinweise zur Namensauflösung
# in der README) bzw. http://<host-ip> im Heimnetzwerk.

services:
  # ---------------------------------------------------------------------------
  # Backend (Go/Fiber + SQLite) - API auf Port 3000 (nur im Docker-Netzwerk)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kitchenops_backend
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    environment:
      # SQLite-Datenbank: liegt im Volume ./data (Container-/dev-gleich)
      DB_PATH: /data/kitchenops.db
      # LLM-Anbieter (provider-agnostisch): Anbieter + Key + Modell werden
      # automatisch aus der .env-Datei gelesen. Unterstützt: mistral (Standard),
      # openai, anthropic, google.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-2603}
      # Logging: debug | info | warn | error, Format: text | json
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      TZ: Europe/Berlin
    volumes:
      # SQLite-Datenbank persists im Unterverzeichnis data/
      - ./data:/data
    networks:
      - kitchenops
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Frontend (nginx) - statische Dateien + Reverse-Proxy auf Port 80
  # ---------------------------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: kitchenops_frontend
    restart: unless-stopped
    ports:
      # Port 80 des Hosts -> im Heimnetzwerk unter http://<host-ip> erreichbar
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - kitchenops
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  kitchenops:
    name: kitchenops
