# KitchenOps Frontend + Reverse-Proxy
# - Statische Dateien des Frontends ausliefern
# - API-Routen (/lebensmittel, /einkaufsliste, /rezepte) an das Backend-Container
#   weiterleiten, damit die App same-origin läuft (kein CORS im Heimnetz nötig)

upstream kitchenops_backend {
    server backend:3000;
}

server {
    listen 80;
    server_name kitchenops.local localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    # --- API-Routen an das Backend proxen ---
    # GET/POST        /lebensmittel
    # GET/PUT/DELETE  /lebensmittel/:id
    # POST            /lebensmittel/kategorisieren
    # GET/POST/DELETE /einkaufsliste
    # PUT/DELETE      /einkaufsliste/:id
    # GET/POST        /rezepte
    # POST            /rezepte/generieren
    location ~ ^/(lebensmittel|einkaufsliste|rezepte)(/|$) {
        proxy_pass http://kitchenops_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM-Aufrufe (Rezept-Generierung) können bis zu 2 Minuten dauern
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    # --- Statische Dateien ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache für Assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Health-Check für Docker
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Gzip-Kompression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    client_max_body_size 2m;
}
